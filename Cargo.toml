[package]
name = "agent-print-session-cli"
version = "1.1.2"
edition = "2024"
license = "MIT"
description = "Read and summarize local Antigravity, Claude, Codex, and Pi session transcripts"

[[bin]]
name = "agent-print-session"
path = "src/main.rs"

[dependencies]
agent-parser = { git = "https://github.com/alexgorbatchev/agent-parser.git", rev = "f5510c8c2881fe35055d80ee99b1ce4124b02670" }
cli-command-kit = { git = "https://github.com/alexgorbatchev/cli-command-kit-rust.git", rev = "dead4a60e08c7a84bc77ef329b220bfecd57627b" }
clap = { version = "4.6.7", features = ["string"] }
clap_complete = "4.6.5"
dirs = "7.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
textwrap = "0.16.4"
thiserror = "2.0.18"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
